# Generated artifacts are committed only when a downstream consumer requires
# them. Every entry names its source, pinned producer, and deterministic drift
# check. Paths are relative to the repository named in `repository`.
artifacts:
  - repository: tree-sitter-mux
    path: src/parser.c
    source: grammar.js
    generator: tree-sitter-cli@0.25.3
    command: npx tree-sitter generate
    check: npx tree-sitter generate && git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json
  - repository: tree-sitter-mux
    path: queries/highlights.scm
    source: grammar.js
    generator: hand-authored query reviewed with grammar changes
    command: npm run check
    check: npm run check
  - repository: mux-syntax-highlighting
    path: editor-support/textmate/mux.tmLanguage.json
    source: shared/syntax-matrix.json
    generator: scripts/generate-syntax.js
    command: node scripts/generate-syntax.js
    check: node scripts/generate-syntax.js && git diff --exit-code
  - repository: mux-website
    path: src/shiki/mux.json
    source: mux-syntax-highlighting/shared/syntax-matrix.json
    generator: manual consumer copy; token parity is enforced by check:syntax-parity
    command: npm run check:syntax-parity
    check: npm run check:syntax-parity
  - repository: mux-compiler
    path: mux-compiler/tests/snapshots/*.snap
    source: mux-compiler/tests/**/*.mux
    generator: insta 1.x snapshot harness
    command: cargo test --workspace
    check: cargo test --workspace --test parser_snapshot_inventory
